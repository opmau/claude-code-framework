name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint all shell scripts
        # The hooks and the tdd-guard reporter ship into every downstream
        # project, so they are linted at the same severity as the installers.
        run: shellcheck --shell=bash bin/*.sh templates/.claude/hooks/*.sh templates/.claude/tdd-guard/reporters/*.sh

  smoke:
    name: setup + update smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: setup.sh installs a project
        run: |
          set -euo pipefail
          proj="$(mktemp -d)/demo"
          bash bin/setup.sh "$proj" --language python
          # Everything the docs promise must actually arrive. /create-ticket and
          # the tdd-guard hook wiring are both useless without their backing files.
          for f in CLAUDE.md .claudeignore \
                   .claude/project.conf \
                   .claude/hooks/check-scope.sh \
                   .claude/tickets/ticket-list.md \
                   .claude/tickets/TICKET-000-template.md \
                   .claude/tdd-guard/data/instructions.md \
                   .claude/tdd-guard/reporters/generic-reporter.sh; do
            test -f "$proj/$f" || { echo "MISSING after setup: $f"; exit 1; }
          done
          grep -q '^IMPL_LIMIT=300' "$proj/.claude/project.conf"
          echo "PROJ=$proj" >> "$GITHUB_ENV"

      - name: update.sh is idempotent and preserves calibration
        run: |
          set -euo pipefail
          bash bin/update.sh "$PROJ"
          # The regression this framework previously had: update reverting
          # setup's --language calibration by overwriting the hook.
          grep -q '^IMPL_LIMIT=300' "$PROJ/.claude/project.conf"
          # A second run must report no changes at all.
          bash bin/update.sh "$PROJ" | tee /tmp/out.txt
          grep -qE 'Updated:[^0-9]*0' /tmp/out.txt
          grep -qE 'New:[^0-9]*0' /tmp/out.txt

      - name: project-authored files survive update without --prune
        run: |
          set -euo pipefail
          echo 'mine' > "$PROJ/.claude/skills/my-own-skill.md"
          bash bin/update.sh "$PROJ"
          test -f "$PROJ/.claude/skills/my-own-skill.md"
          bash bin/update.sh "$PROJ" --prune
          test ! -f "$PROJ/.claude/skills/my-own-skill.md"

      - name: paths containing glob metacharacters are handled literally
        run: |
          set -euo pipefail
          # Regression guard: an unquoted ${var#$pattern} treats [ ] as a glob
          # character class, which made --prune delete the entire install.
          weird="$(mktemp -d)/my[proj]"
          bash bin/setup.sh "$weird" --language python
          before=$(find "$weird/.claude" -type f | wc -l)
          bash bin/update.sh "$weird" --prune
          after=$(find "$weird/.claude" -type f | wc -l)
          echo "before=$before after=$after"
          test "$before" -eq "$after"

      - name: hooks emit exactly one valid JSON object
        run: |
          set -euo pipefail
          printf 'IMPL_LIMIT=10\nFUNC_LIMIT=5\n' > "$PROJ/.claude/project.conf"
          printf 'def f():\n' > "$PROJ/big.py"
          for i in $(seq 40); do echo "    x = $i" >> "$PROJ/big.py"; done
          # Both the size warning and the complexity hint fire here; the hook
          # must still emit a single object that a strict parser accepts.
          jq -nc --arg p "$PROJ/big.py" '{tool_input:{file_path:$p}}' \
            | bash "$PROJ/.claude/hooks/check-file-size.sh" \
            | python3 -c 'import json,sys; json.load(sys.stdin); print("valid single JSON object")'

      - name: scope hook handles Windows-style backslash paths
        run: |
          set -euo pipefail
          jq -nc --arg p 'C:\proj\nowhere\x.py' '{tool_input:{file_path:$p}}' \
            | bash "$PROJ/.claude/hooks/check-scope.sh" \
            | python3 -c 'import json,sys; json.load(sys.stdin); print("valid JSON for backslash path")'
